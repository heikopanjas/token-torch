name: Build

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT: Sources/TokenTorchApp/token-torch.xcodeproj
  SCHEME: token-torch
  APP_NAME: Token Torch
  BUILD_DIR: .build
  ARCHIVE_PATH: .build/Token Torch.xcarchive
  EXPORT_PATH: .build/export
  EXPORT_PLIST: Sources/TokenTorchApp/exportOptions.plist
  APP_PATH: .build/export/Token Torch.app
  CHANGELOG_PATH: .build/CHANGELOG.md
  BOM_PATH: .build/BILL_OF_MATERIALS.md
  DESTINATION: generic/platform=macOS

jobs:
  build:
    name: Build Signed Release App
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show Xcode Version
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Read Version
        run: |
          set -euo pipefail
          APP_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version like 4.2.15" >&2
            exit 1
          fi
          BUILD_TIMESTAMP="$(date -u +%Y%m%d-%H%M%S)"
          PRERELEASE_NAME="token-torch-build-${GITHUB_RUN_NUMBER}-${BUILD_TIMESTAMP}"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "PRERELEASE_NAME=$PRERELEASE_NAME" >> "$GITHUB_ENV"
          echo "ARTIFACT_ZIP=.build/${PRERELEASE_NAME}.zip" >> "$GITHUB_ENV"
          echo "Building Token Torch $APP_VERSION (${GITHUB_RUN_NUMBER})"

      - name: Import Developer ID Certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/token-torch-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$APPLE_SIGNING_IDENTITY"

      - name: Clean Release Artifacts
        run: |
          set -euo pipefail
          rm -rf "$ARCHIVE_PATH" "$EXPORT_PATH" "$ARTIFACT_ZIP"
          mkdir -p "$BUILD_DIR"

      - name: Archive Release App
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "$DESTINATION" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Export Developer ID App
        run: |
          set -euo pipefail
          rm -rf "$EXPORT_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST"

      - name: Package App Artifact
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "$APP_PATH" "$ARTIFACT_ZIP"
          ls -lh "$ARTIFACT_ZIP"

      - name: Generate Changelog And Bill Of Materials
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 --exclude "v${APP_VERSION}-pre.*" 2>/dev/null || true)"
          {
            echo "# Changelog"
            echo
            echo "- version: ${APP_VERSION}"
            echo "- commit: ${GITHUB_SHA}"
            echo "- branch: ${GITHUB_REF_NAME}"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "## Changes since ${PREVIOUS_TAG}"
              git log --no-merges --pretty='- %s (%h)' "${PREVIOUS_TAG}..HEAD"
            else
              echo "## Changes"
              git log --no-merges --pretty='- %s (%h)' HEAD
            fi
          } > "$CHANGELOG_PATH"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Contents/Info.plist")"
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          BUNDLE_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Contents/Info.plist")"
          ARTIFACT_SHA256="$(shasum -a 256 "$ARTIFACT_ZIP" | awk '{ print $1 }')"
          ARTIFACT_SIZE="$(stat -f%z "$ARTIFACT_ZIP")"
          XCODE_VERSION="$(xcodebuild -version | tr '\n' ' ')"
          SWIFT_VERSION="$(swift --version | head -n 1)"
          MACOS_VERSION="$(sw_vers -productVersion)"

          {
            echo "# Bill Of Materials"
            echo
            echo "- artifact: $(basename "$ARTIFACT_ZIP")"
            echo "- artifact size bytes: ${ARTIFACT_SIZE}"
            echo "- artifact sha256: ${ARTIFACT_SHA256}"
            echo "- bundle identifier: ${BUNDLE_ID}"
            echo "- bundle version: ${BUNDLE_VERSION}"
            echo "- bundle build: ${BUNDLE_BUILD}"
            echo "- source commit: ${GITHUB_SHA}"
            echo "- source branch: ${GITHUB_REF_NAME}"
            echo "- runner image: macos-26"
            echo "- macos version: ${MACOS_VERSION}"
            echo "- xcode version: ${XCODE_VERSION}"
            echo "- swift version: ${SWIFT_VERSION}"
            echo
            echo "## Swift Package Dependencies"
            swift package show-dependencies
          } > "$BOM_PATH"

          ls -lh "$CHANGELOG_PATH" "$BOM_PATH"

      - name: Upload App Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PRERELEASE_NAME }}
          path: |
            ${{ env.ARTIFACT_ZIP }}
            ${{ env.CHANGELOG_PATH }}
            ${{ env.BOM_PATH }}
          if-no-files-found: error

      - name: Create GitHub Prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$PRERELEASE_NAME"
          TITLE="$PRERELEASE_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Prerelease $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$TAG" "$ARTIFACT_ZIP" "$CHANGELOG_PATH" "$BOM_PATH" \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$CHANGELOG_PATH"

      - name: Clean Up Signing Keychain
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
