name: Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT: Sources/TokenTorchApp/token-torch.xcodeproj
  SCHEME: token-torch
  APP_NAME: Token Torch
  BUILD_DIR: .build
  ARCHIVE_PATH: .build/Token Torch.xcarchive
  EXPORT_PATH: .build/export
  EXPORT_PLIST: Sources/TokenTorchApp/exportOptions.plist
  APP_PATH: .build/export/Token Torch.app
  NOTARY_ZIP: .build/TokenTorch-notarization.zip
  CHANGELOG_PATH: .build/CHANGELOG.md
  BOM_PATH: .build/BILL_OF_MATERIALS.md
  PACKAGE_DIR: .build/package
  DESTINATION: generic/platform=macOS
  NOTARY_PROFILE: TokenTorch-Notarize

jobs:
  release:
    name: Build And Notarize Release App
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show Xcode Version
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Read Version
        run: |
          set -euo pipefail
          APP_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version like 4.2.15" >&2
            exit 1
          fi
          RELEASE_NAME="token-torch-v${APP_VERSION}"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"
          echo "ARTIFACT_ZIP=.build/${RELEASE_NAME}.zip" >> "$GITHUB_ENV"
          echo "Building Token Torch $APP_VERSION (${GITHUB_RUN_NUMBER})"

      - name: Import Developer ID Certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/token-torch-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$APPLE_SIGNING_IDENTITY"

      - name: Clean Release Artifacts
        run: |
          set -euo pipefail
          rm -rf "$ARCHIVE_PATH" "$EXPORT_PATH" "$NOTARY_ZIP" "$PACKAGE_DIR" "$ARTIFACT_ZIP"
          mkdir -p "$BUILD_DIR"

      - name: Archive Release App
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "$DESTINATION" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Export Developer ID App
        run: |
          set -euo pipefail
          rm -rf "$EXPORT_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST"

      - name: Create Notarization Zip
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "$APP_PATH" "$NOTARY_ZIP"
          ls -lh "$NOTARY_ZIP"

      - name: Store Notarization Credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: Submit For Notarization
        run: |
          set -euo pipefail
          xcrun notarytool submit "$NOTARY_ZIP" \
            --keychain-profile "$NOTARY_PROFILE" \
            --keychain "$KEYCHAIN_PATH" \
            --wait

      - name: Staple Notarization Ticket
        run: |
          set -euo pipefail
          xcrun stapler staple "$APP_PATH"

      - name: Verify Notarized App
        run: |
          set -euo pipefail
          spctl -a -vvv "$APP_PATH"

      - name: Generate Changelog And Bill Of Materials
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 --exclude "v${APP_VERSION}-pre.*" 2>/dev/null || true)"
          {
            echo "# Changelog"
            echo
            echo "- version: ${APP_VERSION}"
            echo "- commit: ${GITHUB_SHA}"
            echo "- branch: ${GITHUB_REF_NAME}"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "## Changes since ${PREVIOUS_TAG}"
              git log --no-merges --pretty='- %s (%h)' "${PREVIOUS_TAG}..HEAD"
            else
              echo "## Changes"
              git log --no-merges --pretty='- %s (%h)' HEAD
            fi
          } > "$CHANGELOG_PATH"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Contents/Info.plist")"
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          BUNDLE_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Contents/Info.plist")"
          XCODE_VERSION="$(xcodebuild -version | tr '\n' ' ')"
          SWIFT_VERSION="$(swift --version | head -n 1)"
          MACOS_VERSION="$(sw_vers -productVersion)"

          {
            echo "# Bill Of Materials"
            echo
            echo "- artifact: $(basename "$ARTIFACT_ZIP")"
            echo "- included app: Token Torch.app"
            echo "- included changelog: CHANGELOG.md"
            echo "- included bill of materials: BILL_OF_MATERIALS.md"
            echo "- bundle identifier: ${BUNDLE_ID}"
            echo "- bundle version: ${BUNDLE_VERSION}"
            echo "- bundle build: ${BUNDLE_BUILD}"
            echo "- source commit: ${GITHUB_SHA}"
            echo "- source branch: ${GITHUB_REF_NAME}"
            echo "- runner image: macos-26"
            echo "- macos version: ${MACOS_VERSION}"
            echo "- xcode version: ${XCODE_VERSION}"
            echo "- swift version: ${SWIFT_VERSION}"
            echo
            echo "## Swift Package Dependencies"
            swift package show-dependencies
          } > "$BOM_PATH"

          ls -lh "$CHANGELOG_PATH" "$BOM_PATH"

      - name: Package Notarized App Artifact
        run: |
          set -euo pipefail
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"
          ditto "$APP_PATH" "${PACKAGE_DIR}/Token Torch.app"
          cp "$CHANGELOG_PATH" "${PACKAGE_DIR}/CHANGELOG.md"
          cp "$BOM_PATH" "${PACKAGE_DIR}/BILL_OF_MATERIALS.md"

          ARTIFACT_ABSOLUTE="$(pwd)/$ARTIFACT_ZIP"
          (
            cd "$PACKAGE_DIR"
            ditto -c -k --keepParent \
              "Token Torch.app" \
              "CHANGELOG.md" \
              "BILL_OF_MATERIALS.md" \
              "$ARTIFACT_ABSOLUTE"
          )
          ls -lh "$ARTIFACT_ZIP"

      - name: Upload Notarized App Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.RELEASE_NAME }}
          path: |
            ${{ env.ARTIFACT_ZIP }}
            ${{ env.CHANGELOG_PATH }}
            ${{ env.BOM_PATH }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          git fetch --tags --force
          if git rev-parse --verify --quiet "$TAG" >/dev/null; then
            echo "Tag $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$TAG" "$ARTIFACT_ZIP" "$CHANGELOG_PATH" "$BOM_PATH" \
            --target "$GITHUB_SHA" \
            --title "Token Torch ${APP_VERSION}" \
            --notes-file "$CHANGELOG_PATH"

      - name: Clean Up Signing Keychain
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
